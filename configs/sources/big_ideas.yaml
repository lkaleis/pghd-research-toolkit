# BIG IDEAs Lab Glycemic Variability and Wearable Device Data v1.1.3 (PhysioNet, ODC-By 1.0)
# - source configuration for the generic ingestion engine. Portability test: no custom Python.
#
# Cite: Cho, Kim, Bent & Dunn (2026), PhysioNet, doi:10.13026/aw6y-fc44; and
#       Bent et al. (2021), npj Digit. Med. 4, 89, doi:10.1038/s41746-021-00465-w.
#
# Run (data stays local and git-ignored):
#   pghd-ready ingest --source configs/sources/big_ideas.yaml \
#     --concepts configs/concepts/shared.yaml configs/conditions/cardiometabolic.yaml \
#     --data-root data/raw/big_ideas --out data/processed/big_ideas
#
# Evidence references:
#   PAGE = PhysioNet project page v1.1.3 (save a copy in data/raw/big_ideas_docs/)
#   HDR  = column headers read with `physionet tables` (2026-11-27), no data rows inspected
#
# Scope: Dexcom G6 glucose, Empatica E4 heart rate, food log, demographics.
# Out of scope (not downloaded; no concepts yet): ACC (32 Hz), BVP (64 Hz), EDA, IBI, TEMP.
#
# Source notes (from the first ingestion run, 2026-11-27; timestamp shapes checked with digits masked):
#   - All Dexcom, Food_Log and HR files 002-016 use 'YYYY-MM-DD hh:mm:ss'. The Dexcom column header says
#     'YYYY-MM-DDThh:mm:ss' but the values use a space, not 'T' (documentation/data inconsistency; parsed as found).
#   - 001/HR_001.csv uses 'M/DD/YY h:mm' with no seconds, for a 1 Hz signal (~60 readings share each minute),
#     and month/day order cannot be confirmed from the format. Its rows are not reinterpreted: they are
#     rejected as unparseable_timestamp and kept in rejected_records (local only). 001 has no HR stream.
#   - Dexcom files are Dexcom Clarity exports: metadata rows (patient/device info, alerts) precede the
#     glucose rows and have no timestamp. They are rejected as missing_timestamp and kept in
#     rejected_records (local only). Only 'EGV' rows (estimated glucose values) become observations.
#   - Clarity writes 'Low'/'High' for values beyond the reporting range; these are flagged
#     unparseable_numeric (value empty, original kept). No device-limit rules are configured because
#     PAGE does not document the reporting limits.

source: big_ideas
version: "0.1"
description: BIG IDEAs Lab v1.1.3 - Dexcom G6 CGM, Empatica E4 heart rate, food log, demographics (gender, HbA1c).

temporal:
  output_timezone: null
  date_shifted: true
  notes: >-
    PAGE: all data are time-shifted by date to prevent reidentification, food logs shifted the same way
    (v1.1.3 fixed misaligned food-log dates). Calendar dates are not real. No timezone is stated; timestamps
    are treated as naive clock times.

event_schema: pghd_ready.conditions.cardiometabolic.schemas:meal_event_schema

annotations:
  assumptions:
    A-BIG-HR-UNIT-01:
      statement: E4 'hr' values are heart rate in beats per minute.
      rationale: >-
        PAGE describes HR as derived from PPG at 1 Hz but states no unit. Beats per minute is the Empatica
        E4 convention. Confirm against Empatica documentation before any analytical use.
    A-BIG-HBA1C-UNIT-01:
      statement: HbA1c in Demographics.csv is NGSP/DCCT %.
      rationale: >-
        PAGE states no unit; the inclusion criterion is point-of-care A1C 5.2-6.4 %, which is only
        consistent with %. Stored unchanged; no conversion.
  flags:
    food_entry_not_meal:
      category: semantic_ambiguity
      description: >-
        Each food-log row is one logged food item, not a meal; several rows may share a start time.
        Grouping items into meals is a research decision and is not done at ingestion.

tables:
  # ---------------------------------------------------------------- Dexcom G6 (Clarity export)
  - name: dexcom
    files: {glob: "*/Dexcom_*.csv"}
    participant_id: {from: path, regex: '(\d{3})/Dexcom_', format: "{0}"}
    read: {drop_columns: ["Patient Info"]}       # identifying-style metadata field; never ingested
    timestamp: {column: ["Timestamp (YYYY-MM-DDThh:mm:ss)"], format: "%Y-%m-%d %H:%M:%S"}   # space, not 'T'
    observations:
      - stream_id: dexcom_g6
        concept: glucose_interstitial
        column: ["Glucose Value (mg/dL)"]
        unit: mg/dL
        required: true
        device: Dexcom G6
        native_interval_s: 300                   # PAGE: every 5 minutes
        where: {column: ["Event Type"], equals: EGV}

  # ---------------------------------------------------------------- Empatica E4 heart rate
  - name: e4_hr
    files: {glob: "*/HR_*.csv"}
    participant_id: {from: path, regex: '(\d{3})/HR_', format: "{0}"}
    timestamp: {column: [datetime], format: "%Y-%m-%d %H:%M:%S"}
    observations:
      - stream_id: e4_hr
        concept: heart_rate
        column: [hr]                             # header has a leading space; matched after normalisation
        unit: /min                               # A-BIG-HR-UNIT-01
        required: true
        device: Empatica E4
        native_interval_s: 1                     # PAGE: HR at 1 Hz

  # ---------------------------------------------------------------- food log (one row per food item)
  # Source defect (owner decision 2026-11-27): 003/Food_Log_003.csv has no header row and 11 fields per
  # row against 14 in every other food log, so three columns are missing and cannot be identified.
  # It is excluded rather than mapped by guesswork; 003's Dexcom and HR files are still ingested.
  # The engine has no file-exclusion option, so the glob is split into two tables that skip 003:
  # 00[!3] = 001-009 except 003; 01? = 010-016. Header drift ('time' vs 'time_of_day') affects an
  # unused column only.
  - name: food_log_00x
    files: {glob: "00[!3]/Food_Log_*.csv"}
    participant_id: {from: path, regex: '(\d{3})/Food_Log_', format: "{0}"}
    timestamp: {column: [time_begin], format: "%Y-%m-%d %H:%M:%S"}
    events: &food_events
      - event_type: food_item
        domains: [behavioural]
        when_present: [logged_food]
        flags: [food_entry_not_meal]
        attributes:
          energy_kcal: {column: [calorie], unit: kcal}
          carbohydrate_g: {column: [total_carb], unit: g}
          protein_g: {column: [protein], unit: g}
          fat_g: {column: [total_fat], unit: g}
          fiber_g: {column: [dietary_fiber], unit: g}
          sugar_g: {column: [sugar], unit: g}
  - name: food_log_01x
    files: {glob: "01?/Food_Log_*.csv"}
    participant_id: {from: path, regex: '(\d{3})/Food_Log_', format: "{0}"}
    timestamp: {column: [time_begin], format: "%Y-%m-%d %H:%M:%S"}
    events: *food_events
  # ---------------------------------------------------------------- one row per participant
  - name: demographics
    files: {path: Demographics.csv}
    participant_id: {from: column, column: [ID], format: "{0:0>3}"}
    attributes:
      - {concept: sex, column: [Gender]}
      - {concept: hba1c, column: [HbA1c], unit: "%"}   # A-BIG-HBA1C-UNIT-01
