# CGMacros v1.0.0 (PhysioNet, CC BY-NC-SA 4.0) - source configuration for the generic ingestion engine.
#
# M1c-1 scope: base ingestion only. No custom Python, no CGM sampling-origin classifier:
# CGM readings keep is_interpolated = unknown. The dataset authors document (Das et al. 2025,
# Scientific Data, doi:10.1038/s41597-025-05851-7) that Libre (15-min) and Dexcom (5-min) readings
# were linearly interpolated to 1-minute intervals before release, so each CGM column mixes
# original and interpolated values. PGHD-Ready does not resample, interpolate or classify CGM values
# and has not verified the origin of any individual value; row-level classification is deferred.
#
# Validation principle (owner decision 2026-11-24): a source configuration contains only
# SOURCE-CONFORMANCE rules, i.e. constraints the source itself documents (device reporting limits,
# definitional ranges such as percentages, documented error codes). It does NOT contain the
# dataset's observed min/max ranges from the data dictionary: those describe CGMacros, not
# real-world validity. Real-world plausibility (implausible / unusual-but-possible / inconsistent)
# is concept-level, reference-backed work for M2 and is not applied at ingestion.
#
# Run (data stays local and git-ignored):
#   pghd-ready ingest --source configs/sources/cgmacros.yaml \
#     --concepts configs/concepts/shared.yaml configs/conditions/cardiometabolic.yaml \
#     --data-root data/raw/cgmacros --out data/processed/cgmacros
#
# Evidence references:
#   DD-TS  = data/raw/cgmacros_docs/DataDictionary_CGMacros-00X.csv (official, checksum-verified)
#   DD-BIO = data/raw/cgmacros_docs/DataDictionary_Bio.csv (official, checksum-verified)
#   PAGE   = PhysioNet project page v1.0.0 (saved in data/raw/cgmacros_docs/)
#
# Out of scope (deliberately not configured): gut_health_test.csv, microbes.csv, photo contents,
# the undocumented 'Sugar' column (one file) and 'RecordIndex' (one file). Unused columns are
# listed in every ingestion report.

source: cgmacros
version: "1.1"
description: CGMacros v1.0.0 - CGM (Libre Pro, Dexcom G6 Pro), Fitbit Sense, logged meals, participant biomarkers.

temporal:
  output_timezone: null
  date_shifted: true
  notes: >-
    Timestamps are naive clock times; PAGE states dates were randomly shifted by +/- N days
    (365 < N < 720) per participant, so calendar dates, weekdays and seasons are not real.
    No timezone is assumed. DD-TS documents 'Month/Day/Year HH:MM' but the files use
    'YYYY-MM-DD HH:MM:SS' (documentation/data inconsistency; parsed as found).

event_schema: pghd_ready.conditions.cardiometabolic.schemas:meal_event_schema

annotations:
  flags:
    # ---- source conformance (documented by the source itself)
    at_documented_reporting_limit:
      category: documented_issue
      action: flag
      description: >-
        Source conformance: CGM value equals the documented device reporting limit (40 or 400 mg/dL);
        the true glucose may lie beyond it (censored). Value kept unchanged.
      evidence: "DD-TS 'Libre GL'/'Dexcom GL': minimum possible value of 40 and maximum possible value of 400"
    outside_documented_device_limits:
      category: suspected_anomaly
      description: >-
        Source conformance: CGM value lies outside the documented device reporting limits of 40-400 mg/dL
        (strict comparison), which contradicts the source documentation. Not a clinical plausibility
        judgement. Value kept unchanged.
    amount_outside_documented_range:
      category: semantic_ambiguity
      description: >-
        Source conformance: 'Amount Consumed' is documented as a percentage (0-100 %); values outside
        0-100 have unresolved meaning (percent, servings, multiplier?). Kept unchanged, not interpreted.
    documented_error_code:
      category: documented_issue
      action: set_null
      description: Source conformance - value documented as an erroneous reading/calculation; standardised value emptied, original kept.
      evidence: "DD-BIO: 'LDL (Cal) ... 800 is an error in calculation'; 'VLDL (Cal) ... 400 indicates an erroneous reading'"
    # ---- documentation gaps / unresolved semantics
    semantics_undocumented:
      category: semantic_ambiguity
      description: Field is not described in the official data dictionary; values stored but not interpreted.

tables:
  # ---------------------------------------------------------------- per-participant 1-minute files
  - name: timeseries
    files: {glob: "CGMacros-*/CGMacros-*.csv"}
    participant_id: {from: path, regex: 'CGMacros-(\d{3})/', format: "{0}"}
    read: {encoding: utf-8-sig, drop_columns: ["Unnamed: 0"]}
    timestamp: {column: [Timestamp], format: "%Y-%m-%d %H:%M:%S"}
    observations:
      # CGM: sampling origin deliberately NOT declared (unknown); device-limit conformance only
      - stream_id: libre_pro
        concept: glucose_interstitial
        column: [Libre GL]
        unit: mg/dL
        required: true
        device: Abbott FreeStyle Libre Pro (upper arm)
        native_interval_s: 900          # PAGE: 15-min sampling period
        rules:
          - {when: {in: [40, 400]}, flag: at_documented_reporting_limit}
          - {when: {outside: [40, 400]}, flag: outside_documented_device_limits}
      - stream_id: dexcom_g6
        concept: glucose_interstitial
        column: [Dexcom GL]
        unit: mg/dL
        required: true
        device: Dexcom G6 Pro (abdomen)
        native_interval_s: 300          # PAGE: 5-min sampling
        rules:
          - {when: {in: [40, 400]}, flag: at_documented_reporting_limit}
          - {when: {outside: [40, 400]}, flag: outside_documented_device_limits}
      # Fitbit: no range rules (the dictionary ranges describe this dataset, not device constraints)
      - stream_id: fitbit_hr
        concept: heart_rate
        column: [HR]
        unit: /min
        required: true
        device: Fitbit Sense
      - stream_id: fitbit_activity_kcal
        concept: activity_energy_expenditure
        column: [Calories (Activity)]
        unit: kcal
        device: Fitbit Sense
      - stream_id: fitbit_met
        concept: physical_activity_met
        column: [METs]
        unit: "{MET}"
        device: Fitbit Sense
        scale:
          factor: 0.1
          basis: documented
          evidence: "DD-TS 'Mets': Metabolic Equivalent of Task ... as provided by the FitBit Sense multiplied by 10"
      - stream_id: fitbit_intensity
        concept: activity_intensity_level
        column: [Intensity]
        device: Fitbit Sense
        flags: [semantics_undocumented]
      - stream_id: fitbit_steps
        concept: step_count
        column: [Steps]
        unit: "{steps}"
        device: Fitbit Sense
        flags: [semantics_undocumented]
    events:
      - event_type: meal
        domains: [behavioural]
        when_present: [Meal Type]
        subtype:
          column: [Meal Type]
          map:                          # case/plural variants only; anything else is flagged unmapped
            breakfast: [Breakfast, breakfast]
            lunch: [Lunch, lunch]
            dinner: [Dinner, dinner]
            snack: [Snack, snack, Snacks, snacks]
        attributes:
          # nutrients: no range rules (dictionary ranges are descriptive/unreliable; meal values cannot be
          # assessed in isolation). Consistency checks (e.g. Atwater energy) are M2 candidates.
          energy_kcal: {column: [Calories], unit: kcal}
          carbohydrate_g: {column: [Carbs], unit: g}
          protein_g: {column: [Protein], unit: g}
          fat_g: {column: [Fat], unit: g}
          fiber_g: {column: [Fiber], unit: g}
          amount_consumed_raw:
            column: [Amount Consumed]
            rules: [{when: {outside: [0, 100]}, flag: amount_outside_documented_range}]   # percentage definition
          image_ref: {column: [Image path], kind: text}
      - event_type: meal_photo          # DD-TS: photo of the start or end of a meal; not paired here
        domains: [behavioural]
        when_present: [Image path]
        attributes:
          image_ref: {column: [Image path], kind: text}

  # ---------------------------------------------------------------- one row per participant
  # No observed-range rules: the DD-BIO ranges equal this dataset's observed min/max. Real-world
  # plausibility (with references) is M2 work. Only documented error codes are applied here.
  - name: bio
    files: {path: bio.csv}
    participant_id: {from: column, column: [subject], format: "{0:0>3}"}
    attributes:
      - {concept: age, column: [Age], unit: a}
      - {concept: sex, column: [Gender]}
      - {concept: self_identified_race_ethnicity, column: [Self-identify]}
      - {concept: body_mass_index, column: [BMI], unit: kg/m2}
      - {concept: body_weight, column: [Body weight], unit: "[lb_av]"}
      - {concept: body_height, column: [Height], unit: "[in_i]"}
      # HbA1c is reported in NGSP/DCCT % although DD-BIO labels the unit mmol/mol (documentation error; evidence:
      # Das et al. 2025, Table 2 reports HbA1c (%) 6.16 +/- 0.91 and the group cut-offs <5.7 / 5.7-6.4 / >6.4 %).
      # Values are stored unchanged; no conversion. See the private data inventory.
      - concept: hba1c
        column: [A1c PDL (Lab)]
        unit: "%"
        measured_at_raw: [Collection time PDL (Lab)]
      - {concept: fasting_glucose_lab, column: [Fasting GLU - PDL (Lab)], unit: mg/dL,
         measured_at_raw: [Collection time PDL (Lab)]}
      - {concept: fasting_insulin, column: [Insulin], unit: "u[IU]/mL",   # DD-BIO: mcU/mL
         measured_at_raw: [Collection time PDL (Lab)]}
      - {concept: triglycerides, column: [Triglycerides], unit: mg/dL, measured_at_raw: [Collection time PDL (Lab)]}
      - {concept: total_cholesterol, column: [Cholesterol], unit: mg/dL, measured_at_raw: [Collection time PDL (Lab)]}
      - {concept: hdl_cholesterol, column: [HDL], unit: mg/dL, measured_at_raw: [Collection time PDL (Lab)]}
      - {concept: non_hdl_cholesterol, column: [Non HDL], unit: mg/dL, measured_at_raw: [Collection time PDL (Lab)]}
      - {concept: ldl_cholesterol_calculated, column: [LDL (Cal)], unit: mg/dL,
         measured_at_raw: [Collection time PDL (Lab)],
         rules: [{when: {equals: 800}, flag: documented_error_code}]}      # DD-BIO documented error code
      - {concept: vldl_cholesterol_calculated, column: [VLDL (Cal)], unit: mg/dL,
         measured_at_raw: [Collection time PDL (Lab)],
         rules: [{when: {equals: 400}, flag: documented_error_code}]}      # DD-BIO documented error code
      # Cholesterol/HDL ratio: no rule. The single value of 400 (same record as the LDL/VLDL error codes)
      # is recorded in the private data inventory; a reusable cross-field check (ratio vs TC/HDL) is M2 work.
      - {concept: cholesterol_hdl_ratio, column: [Cho/HDL Ratio], unit: "1",
         measured_at_raw: [Collection time PDL (Lab)]}
      # Fingersticks (DD-BIO: taken on day 1; only clock times are recorded, so no timestamp is built)
      - {concept: capillary_glucose, column: ["#1 Contour Fingerstick GLU"], unit: mg/dL, measured_at_raw: ["Time (t)"]}
      - {concept: capillary_glucose, column: ["#2 Contour Fingerstick GLU"], unit: mg/dL, measured_at_raw: ["Time (t).1"]}
      - {concept: capillary_glucose, column: ["#3 Contour Fingerstick GLU"], unit: mg/dL, measured_at_raw: ["Time (t).2"]}
