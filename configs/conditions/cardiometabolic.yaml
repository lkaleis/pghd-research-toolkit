# Cardiometabolic concept registry (v0.1).
#
# Scope: only concepts needed for the initial CGMacros ingestion (M1c) and the
# planned synthetic app source. Add concepts when a source or task needs them.
#
# Units are UCUM codes known to pghd_ready.core.units.
# unit_conversions: substance-specific factors (multiply a value in that unit by
# the factor to obtain the canonical unit). Generic same-dimension conversions
# (e.g. lb -> kg) come from the core unit table and are not repeated here.
#
# references: pointers to external standards for orientation only; they are
# NOT verified mappings and are marked as such.

condition: cardiometabolic
version: "0.1"

concepts:
  # ---------------------------------------------------------------- observations
  glucose_interstitial:
    kind: observation
    value_type: numeric
    canonical_unit: mg/dL
    unit_conversions:
      # 1 mmol/L glucose = 18.016 mg/dL (glucose molar mass 180.16 g/mol).
      mmol/L: 18.016
    description: Interstitial glucose measured by a continuous glucose monitor.
    references:
      open_mhealth: "blood-glucose schema family (specimen source: interstitial fluid) - unverified"

  heart_rate:
    kind: observation
    value_type: numeric
    canonical_unit: /min
    description: Heart rate in beats per minute as reported by a wearable for its epoch.
    references:
      open_mhealth: "heart-rate schema - unverified"

  physical_activity_met:
    kind: observation
    value_type: numeric
    canonical_unit: "{MET}"
    description: Metabolic equivalent of task for the device epoch (source encodings such as MET x 10 must be rescaled explicitly at ingestion).

  activity_intensity_level:
    kind: observation
    value_type: ordinal
    description: >-
      Ordinal activity-intensity code reported by a wearable for its epoch. Level
      semantics are source-defined; never pooled with physical_activity_met.

  step_count:
    kind: observation
    value_type: numeric
    canonical_unit: "{steps}"
    description: Steps counted within the device epoch.
    references:
      open_mhealth: "step-count schema - unverified"

  activity_energy_expenditure:
    kind: observation
    value_type: numeric
    canonical_unit: kcal
    description: Device-estimated energy expenditure within the device epoch.
    references:
      open_mhealth: "calories-burned schema - unverified"

  # ---------------------------------------------------------------- attributes
  age:
    kind: attribute
    value_type: numeric
    canonical_unit: a
    description: Age in years at study start.

  sex:
    kind: attribute
    value_type: categorical
    description: Sex/gender as recorded by the source (source coding preserved).

  self_identified_race_ethnicity:
    kind: attribute
    value_type: categorical
    description: Self-identified race/ethnicity as recorded by the source (labels preserved, not harmonised).

  body_weight:
    kind: attribute
    value_type: numeric
    canonical_unit: kg
    description: Body weight at study start.

  body_height:
    kind: attribute
    value_type: numeric
    canonical_unit: cm
    description: Body height.

  body_mass_index:
    kind: attribute
    value_type: numeric
    canonical_unit: kg/m2
    description: Body mass index as reported by the source (not recomputed).

  hba1c:
    kind: attribute
    value_type: numeric
    canonical_unit: "%"
    description: >-
      Glycated haemoglobin in NGSP %. Values in IFCC mmol/mol require a
      non-linear (affine) conversion that is intentionally not defined here.

  fasting_glucose_lab:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    unit_conversions:
      mmol/L: 18.016
    description: Fasting plasma glucose from a laboratory measurement.

  fasting_insulin:
    kind: attribute
    value_type: numeric
    canonical_unit: u[IU]/mL
    description: Fasting serum insulin.

  triglycerides:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Fasting triglycerides.

  total_cholesterol:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Fasting total cholesterol.

  hdl_cholesterol:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Fasting HDL cholesterol.

  non_hdl_cholesterol:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Non-HDL cholesterol.

  ldl_cholesterol_calculated:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Calculated LDL cholesterol (calculation method as reported by the source).

  vldl_cholesterol_calculated:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Calculated VLDL cholesterol.

  cholesterol_hdl_ratio:
    kind: attribute
    value_type: numeric
    canonical_unit: "1"
    description: Total cholesterol to HDL ratio.

  capillary_glucose:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    unit_conversions:
      mmol/L: 18.016
    description: >-
      Fingerstick glucose. Stored as an attribute (not an observation) when the
      measurement date cannot be resolved; the raw clock time is kept in
      measured_at_raw.
