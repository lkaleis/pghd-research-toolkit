# Cardiometabolic concept registry (v0.2).
#
# Scope: concepts specific to cardiometabolic research that are needed by current
# sources (CGMacros in M1c, the synthetic demo). Condition-independent concepts
# (heart rate, activity, anthropometrics, demographics) live in
# configs/concepts/shared.yaml; load both, e.g.
#   --concepts configs/concepts/shared.yaml configs/conditions/cardiometabolic.yaml
#
# Units are UCUM codes known to pghd_ready.core.units.
# unit_conversions: substance-specific factors (multiply a value in that unit by
# the factor to obtain the canonical unit). Generic same-dimension conversions
# (e.g. lb -> kg) come from the core unit table and are not repeated here.
#
# domains: optional, descriptive, many-to-many tags (see shared.yaml). Laboratory
# values measured in a clinical setting are deliberately untagged: they are
# clinical baseline data rather than patient-generated health data.
#
# references: orientation only; NOT verified mappings.

registry: cardiometabolic
version: "0.2"

concepts:
  # ---------------------------------------------------------------- observations
  glucose_interstitial:
    kind: observation
    value_type: numeric
    canonical_unit: mg/dL
    unit_conversions:
      # 1 mmol/L glucose = 18.016 mg/dL (glucose molar mass 180.16 g/mol).
      mmol/L: 18.016
    description: Interstitial glucose measured by a continuous glucose monitor.
    domains: [physiological]
    references:
      open_mhealth: "blood-glucose schema family (specimen source: interstitial fluid) - unverified"

  # ---------------------------------------------------------------- attributes
  capillary_glucose:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    unit_conversions:
      mmol/L: 18.016
    description: >-
      Fingerstick glucose. Stored as an attribute (not an observation) when the
      measurement date cannot be resolved; the raw clock time is kept in
      measured_at_raw.
    domains: [physiological]

  hba1c:
    kind: attribute
    value_type: numeric
    canonical_unit: "%"
    accepted_units: ["mmol/mol"]
    description: >-
      Glycated haemoglobin, reported either in % (DCCT/NGSP) or in mmol/mol
      (IFCC SI units). Both are accepted and each value is stored in the unit
      in which it was measured. No conversion is applied: the relation between
      the two is affine (IFCC = 10.93 x NGSP - 23.50), so values in different
      units must not be pooled without an explicit, reviewed conversion.

  fasting_glucose_lab:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    unit_conversions:
      mmol/L: 18.016
    description: Fasting plasma glucose from a laboratory measurement.

  fasting_insulin:
    kind: attribute
    value_type: numeric
    canonical_unit: u[IU]/mL
    description: Fasting serum insulin.

  triglycerides:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Fasting triglycerides.

  total_cholesterol:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Fasting total cholesterol.

  hdl_cholesterol:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Fasting HDL cholesterol.

  non_hdl_cholesterol:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Non-HDL cholesterol.

  ldl_cholesterol_calculated:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Calculated LDL cholesterol (calculation method as reported by the source).

  vldl_cholesterol_calculated:
    kind: attribute
    value_type: numeric
    canonical_unit: mg/dL
    description: Calculated VLDL cholesterol.

  cholesterol_hdl_ratio:
    kind: attribute
    value_type: numeric
    canonical_unit: "1"
    description: Total cholesterol to HDL ratio.
