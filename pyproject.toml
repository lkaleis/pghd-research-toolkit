[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pghd-ready"
version = "0.1.0.dev0"
description = "Toolkit for integrating, standardising and assessing patient-generated health data (PGHD) for research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pandera>=0.20",
]

[project.scripts]
pghd-ready = "pghd_ready.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real_data: requires the local CGMacros dataset under data/raw/cgmacros (skipped when absent)",
]
